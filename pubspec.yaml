name: qlearner
description: A Quran learning app with Clean Architecture and Riverpod
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Audio
  just_audio: ^0.9.36
  audio_service: ^0.18.8
  rxdart: ^0.27.7

  # Database
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.2

  # Networking
  dio: ^5.4.0

  # Quran Data
  quran: ^1.2.0

  # Fonts
  google_fonts: ^6.1.0

  # Local Persistence
  shared_preferences: ^2.2.3

  # Utilities
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
