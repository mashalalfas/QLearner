<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library - QLearner</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            /* Material Design 3 Cotton Cloud Color Scheme */
            --md-sys-color-primary: #6750A4;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #EADDFF;
            --md-sys-color-on-primary-container: #21005D;
            --md-sys-color-secondary: #625B71;
            --md-sys-color-on-secondary: #FFFFFF;
            --md-sys-color-secondary-container: #E8DEF8;
            --md-sys-color-on-secondary-container: #1D192B;
            --md-sys-color-tertiary: #7D5260;
            --md-sys-color-on-tertiary: #FFFFFF;
            --md-sys-color-tertiary-container: #FFD8E4;
            --md-sys-color-on-tertiary-container: #31111D;
            --md-sys-color-error: #B3261E;
            --md-sys-color-on-error: #FFFFFF;
            --md-sys-color-error-container: #F9DEDC;
            --md-sys-color-on-error-container: #410E0B;
            --md-sys-color-background: #FFFBFE;
            --md-sys-color-on-background: #1C1B1F;
            --md-sys-color-surface: #FFFBFE;
            --md-sys-color-on-surface: #1C1B1F;
            --md-sys-color-surface-variant: #E7E0EC;
            --md-sys-color-on-surface-variant: #49454F;
            --md-sys-color-outline: #79747E;
            --md-sys-color-outline-variant: #CAC4D0;
            --md-sys-color-shadow: #000000;
            --md-sys-color-scrim: #000000;
            --md-sys-color-inverse-surface: #313033;
            --md-sys-color-inverse-on-surface: #F4EFF4;
            --md-sys-color-inverse-primary: #D0BCFF;

            /* Cotton Cloud custom colors */
            --cloud-bg: linear-gradient(180deg, #F5F3FF 0%, #FFFFFF 100%);
            --card-bg: #FFFFFF;
            --card-shadow: 0 2px 8px rgba(103, 80, 164, 0.1);
            --elevation-1: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.24);
            --elevation-2: 0 3px 6px rgba(0,0,0,0.15), 0 2px 4px rgba(0,0,0,0.12);
            --elevation-3: 0 10px 20px rgba(0,0,0,0.15), 0 3px 6px rgba(0,0,0,0.10);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--cloud-bg);
            color: var(--md-sys-color-on-background);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* Top App Bar */
        .top-app-bar {
            position: sticky;
            top: 0;
            background: var(--md-sys-color-surface);
            box-shadow: var(--elevation-1);
            padding: 16px 24px;
            z-index: 100;
        }

        .top-app-bar h1 {
            font-size: 22px;
            font-weight: 400;
            color: var(--md-sys-color-on-surface);
        }

        /* Main Container */
        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Tab Layout */
        .tab-layout {
            display: flex;
            flex-direction: column;
            margin-top: 16px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }

        .tabs {
            display: flex;
            background: var(--md-sys-color-surface-variant);
            position: relative;
        }

        .tab {
            flex: 1;
            padding: 16px 8px;
            text-align: center;
            font-weight: 500;
            font-size: 14px;
            color: var(--md-sys-color-on-surface-variant);
            cursor: pointer;
            transition: color 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .tab.active {
            color: var(--md-sys-color-primary);
        }

        .tab-indicator {
            position: absolute;
            bottom: 0;
            height: 3px;
            background: var(--md-sys-color-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-content {
            padding: 16px;
            min-height: 400px;
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* List Items */
        .list-item {
            display: flex;
            align-items: center;
            padding: 16px;
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: var(--card-shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .list-item:active {
            transform: scale(0.98);
        }

        .list-item.swiping {
            transition: transform 0.2s;
        }

        .item-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--md-sys-color-primary-container);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            flex-shrink: 0;
        }

        .item-icon .material-icons {
            color: var(--md-sys-color-primary);
            font-size: 24px;
        }

        .item-content {
            flex: 1;
            min-width: 0;
        }

        .item-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--md-sys-color-on-surface);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-subtitle {
            font-size: 14px;
            color: var(--md-sys-color-on-surface-variant);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-meta {
            font-size: 12px;
            color: var(--md-sys-color-outline);
            margin-top: 2px;
        }

        .item-action {
            margin-left: 12px;
        }

        .item-action .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .item-action .btn-icon:hover {
            background: var(--md-sys-color-surface-variant);
        }

        .item-action .btn-icon .material-icons {
            color: var(--md-sys-color-primary);
        }

        /* Swipe to Delete */
        .swipe-delete-bg {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 100%;
            background: var(--md-sys-color-error);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 24px;
            z-index: -1;
        }

        .swipe-delete-bg .material-icons {
            color: var(--md-sys-color-on-error);
            font-size: 24px;
        }

        /* Downloads Delete Button */
        .delete-btn {
            background: var(--md-sys-color-error-container);
            color: var(--md-sys-color-on-error-container);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background: var(--md-sys-color-error);
            color: var(--md-sys-color-on-error);
        }

        /* Pull to Refresh */
        .pull-to-refresh {
            display: none;
            text-align: center;
            padding: 16px;
            color: var(--md-sys-color-primary);
        }

        .pull-to-refresh.active {
            display: block;
        }

        .pull-to-refresh .material-icons {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Empty States */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            text-align: center;
        }

        .empty-state .illustration {
            width: 120px;
            height: 120px;
            margin-bottom: 24px;
            opacity: 0.6;
        }

        .empty-state .title {
            font-size: 18px;
            font-weight: 500;
            color: var(--md-sys-color-on-surface);
            margin-bottom: 8px;
        }

        .empty-state .description {
            font-size: 14px;
            color: var(--md-sys-color-on-surface-variant);
            max-width: 280px;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--md-sys-color-surface);
            box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 16px;
            color: var(--md-sys-color-on-surface-variant);
            text-decoration: none;
            font-size: 12px;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--md-sys-color-primary);
        }

        .nav-item .material-icons {
            font-size: 24px;
            margin-bottom: 4px;
        }

        /* Swipe Animation */
        @keyframes swipeOut {
            to {
                transform: translateX(-100%);
                opacity: 0;
            }
        }

        .swipe-out {
            animation: swipeOut 0.3s forwards;
        }
    </style>
</head>
<body>
    <!-- Top App Bar -->
    <header class="top-app-bar">
        <h1>Library</h1>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Pull to Refresh -->
        <div class="pull-to-refresh" id="pullToRefresh">
            <span class="material-icons">refresh</span>
            <span>Refreshing...</span>
        </div>

        <!-- Tab Layout -->
        <div class="tab-layout">
            <div class="tabs">
                <div class="tab active" data-tab="bookmarks">Bookmarks</div>
                <div class="tab" data-tab="recents">Recents</div>
                <div class="tab" data-tab="downloads">Downloads</div>
                <div class="tab-indicator" id="tabIndicator"></div>
            </div>

            <div class="tab-content">
                <!-- Bookmarks Tab -->
                <div class="tab-pane active" id="bookmarks">
                    <div id="bookmarksList"></div>
                </div>

                <!-- Recents Tab -->
                <div class="tab-pane" id="recents">
                    <div id="recentsList"></div>
                </div>

                <!-- Downloads Tab -->
                <div class="tab-pane" id="downloads">
                    <div id="downloadsList"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="#home" class="nav-item">
            <span class="material-icons">home</span>
            <span>Home</span>
        </a>
        <a href="#search" class="nav-item">
            <span class="material-icons">search</span>
            <span>Search</span>
        </a>
        <a href="#library" class="nav-item active">
            <span class="material-icons">book</span>
            <span>Library</span>
        </a>
        <a href="#settings" class="nav-item">
            <span class="material-icons">settings</span>
            <span>Settings</span>
        </a>
    </nav>

    <script>
        // Dummy Data
        const dummyData = {
            bookmarks: [
                {
                    id: 1,
                    surah: "Al-Fatihah",
                    surahNumber: 1,
                    verseNumber: 1,
                    note: "Opening chapter - memorize",
                    lastPosition: 0.45,
                    dateAdded: "2026-05-10"
                },
                {
                    id: 2,
                    surah: "Al-Ikhlas",
                    surahNumber: 112,
                    verseNumber: 1,
                    note: "Important for Salah",
                    lastPosition: 0.78,
                    dateAdded: "2026-05-08"
                },
                {
                    id: 3,
                    surah: "Al-Mulk",
                    surahNumber: 67,
                    verseNumber: 1,
                    note: "Night reading",
                    lastPosition: 0.23,
                    dateAdded: "2026-05-05"
                },
                {
                    id: 4,
                    surah: "Yasin",
                    surahNumber: 36,
                    verseNumber: 1,
                    note: "Heart softener",
                    lastPosition: 0.56,
                    dateAdded: "2026-05-01"
                },
                {
                    id: 5,
                    surah: "Ar-Rahman",
                    surahNumber: 55,
                    verseNumber: 1,
                    note: "Beautiful recitation",
                    lastPosition: 0.12,
                    dateAdded: "2026-04-28"
                }
            ],
            recents: [
                {
                    id: 1,
                    surah: "Al-Baqarah",
                    surahNumber: 2,
                    lastPlayed: "2 hours ago",
                    duration: "45 min"
                },
                {
                    id: 2,
                    surah: "Al-Fatihah",
                    surahNumber: 1,
                    lastPlayed: "Yesterday",
                    duration: "1 min"
                },
                {
                    id: 3,
                    surah: "Yasin",
                    surahNumber: 36,
                    lastPlayed: "3 days ago",
                    duration: "22 min"
                },
                {
                    id: 4,
                    surah: "Al-Mulk",
                    surahNumber: 67,
                    lastPlayed: "1 week ago",
                    duration: "18 min"
                }
            ],
            downloads: [
                {
                    id: 1,
                    surah: "Al-Fatihah",
                    surahNumber: 1,
                    reciter: "Mishary Alafasy",
                    quality: "High",
                    size: "2.4 MB",
                    dateDownloaded: "2026-05-10"
                },
                {
                    id: 2,
                    surah: "Al-Ikhlas",
                    surahNumber: 112,
                    reciter: "Abdul Basit",
                    quality: "Medium",
                    size: "1.2 MB",
                    dateDownloaded: "2026-05-08"
                },
                {
                    id: 3,
                    surah: "Al-Mulk",
                    surahNumber: 67,
                    reciter: "Mishary Alafasy",
                    quality: "High",
                    size: "3.1 MB",
                    dateDownloaded: "2026-05-05"
                }
            ]
        };

        // Tab Management
        const tabs = document.querySelectorAll('.tab');
        const tabPanes = document.querySelectorAll('.tab-pane');
        const tabIndicator = document.getElementById('tabIndicator');

        function updateTabIndicator(activeTab) {
            const tabWidth = activeTab.offsetWidth;
            const tabLeft = activeTab.offsetLeft;
            tabIndicator.style.width = `${tabWidth}px`;
            tabIndicator.style.left = `${tabLeft}px`;
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tabPanes.forEach(p => p.classList.remove('active'));

                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
                updateTabIndicator(tab);
            });
        });

        // Initialize tab indicator
        setTimeout(() => {
            const activeTab = document.querySelector('.tab.active');
            updateTabIndicator(activeTab);
        }, 100);

        // Render Functions
        function renderBookmarks() {
            const container = document.getElementById('bookmarksList');
            if (dummyData.bookmarks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg class="illustration" viewBox="0 0 120 120" fill="none">
                            <path d="M60 20 L80 40 L100 30 L85 55 L95 80 L60 65 L25 80 L35 55 L20 30 L40 40 Z" stroke="#CAC4D0" stroke-width="2"/>
                        </svg>
                        <h3 class="title">No Bookmarks Yet</h3>
                        <p class="description">Start bookmarking verses to access them quickly later</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = dummyData.bookmarks.map(item => `
                <div class="list-item" data-id="${item.id}" data-type="bookmark">
                    <div class="swipe-delete-bg">
                        <span class="material-icons">delete</span>
                    </div>
                    <div class="item-icon">
                        <span class="material-icons">menu_book</span>
                    </div>
                    <div class="item-content">
                        <div class="item-title">${item.surah} ${item.verseNumber}</div>
                        <div class="item-subtitle">${item.note}</div>
                        <div class="item-meta">Last position: ${Math.round(item.lastPosition * 100)}%</div>
                    </div>
                    <div class="item-action">
                        <button class="btn-icon" aria-label="Play">
                            <span class="material-icons">play_arrow</span>
                        </button>
                    </div>
                </div>
            `).join('');

            // Add swipe functionality
            setupSwipeToDelete(container);
        }

        function renderRecents() {
            const container = document.getElementById('recentsList');
            if (dummyData.recents.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg class="illustration" viewBox="0 0 120 120" fill="none">
                            <circle cx="60" cy="60" r="40" stroke="#CAC4D0" stroke-width="2"/>
                            <path d="M45 55 L60 70 L75 50" stroke="#CAC4D0" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <h3 class="title">No Recent Plays</h3>
                        <p class="description">Your recently played surahs will appear here</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = dummyData.recents.map(item => `
                <div class="list-item" data-id="${item.id}" data-type="recent">
                    <div class="item-icon">
                        <span class="material-icons">history</span>
                    </div>
                    <div class="item-content">
                        <div class="item-title">Surah ${item.surah} (${item.surahNumber})</div>
                        <div class="item-subtitle">Last played: ${item.lastPlayed}</div>
                        <div class="item-meta">Duration: ${item.duration}</div>
                    </div>
                    <div class="item-action">
                        <button class="btn-icon" aria-label="Play">
                            <span class="material-icons">play_arrow</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderDownloads() {
            const container = document.getElementById('downloadsList');
            if (dummyData.downloads.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg class="illustration" viewBox="0 0 120 120" fill="none">
                            <path d="M60 30 L90 60 L75 60 L75 90 L45 90 L45 60 L30 60 Z" stroke="#CAC4D0" stroke-width="2"/>
                        </svg>
                        <h3 class="title">No Downloads</h3>
                        <p class="description">Download surahs for offline listening</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = dummyData.downloads.map(item => `
                <div class="list-item" data-id="${item.id}" data-type="download">
                    <div class="item-icon">
                        <span class="material-icons">download</span>
                    </div>
                    <div class="item-content">
                        <div class="item-title">Surah ${item.surah} (${item.surahNumber})</div>
                        <div class="item-subtitle">${item.reciter} • ${item.quality}</div>
                        <div class="item-meta">${item.size} • Downloaded: ${item.dateDownloaded}</div>
                    </div>
                    <div class="item-action">
                        <button class="delete-btn" data-id="${item.id}">Delete</button>
                    </div>
                </div>
            `).join('');

            // Add delete handlers
            container.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    deleteDownload(id);
                });
            });
        }

        // Swipe to Delete (Visual Only)
        function setupSwipeToDelete(container) {
            const items = container.querySelectorAll('.list-item');
            let startX = 0;
            let currentX = 0;
            let isDragging = false;

            items.forEach(item => {
                item.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    isDragging = true;
                    item.style.transition = 'none';
                });

                item.addEventListener('touchmove', (e) => {
                    if (!isDragging) return;
                    currentX = e.touches[0].clientX;
                    const diff = startX - currentX;

                    if (diff > 0) {
                        item.style.transform = `translateX(-${Math.min(diff, 100)}px)`;
                    }
                });

                item.addEventListener('touchend', () => {
                    if (!isDragging) return;
                    isDragging = false;
                    const diff = startX - currentX;

                    if (diff > 50) {
                        item.style.transition = 'transform 0.3s';
                        item.style.transform = 'translateX(-100%)';
                        setTimeout(() => {
                            item.style.display = 'none';
                        }, 300);
                    } else {
                        item.style.transition = 'transform 0.2s';
                        item.style.transform = 'translateX(0)';
                    }
                });

                // Mouse support
                let mouseDown = false;
                item.addEventListener('mousedown', (e) => {
                    mouseDown = true;
                    startX = e.clientX;
                    item.style.transition = 'none';
                });

                document.addEventListener('mousemove', (e) => {
                    if (!mouseDown) return;
                    currentX = e.clientX;
                    const diff = startX - currentX;

                    if (diff > 0) {
                        item.style.transform = `translateX(-${Math.min(diff, 100)}px)`;
                    }
                });

                document.addEventListener('mouseup', () => {
                    if (!mouseDown) return;
                    mouseDown = false;
                    const diff = startX - currentX;

                    if (diff > 50) {
                        item.style.transition = 'transform 0.3s';
                        item.style.transform = 'translateX(-100%)';
                        setTimeout(() => {
                            item.style.display = 'none';
                        }, 300);
                    } else {
                        item.style.transition = 'transform 0.2s';
                        item.style.transform = 'translateX(0)';
                    }
                });
            });
        }

        // Delete Download
        function deleteDownload(id) {
            dummyData.downloads = dummyData.downloads.filter(item => item.id !== id);
            renderDownloads();
        }

        // Pull to Refresh
        let pullStartY = 0;
        let pulling = false;

        document.addEventListener('touchstart', (e) => {
            if (window.scrollY === 0) {
                pullStartY = e.touches[0].clientY;
                pulling = true;
            }
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (!pulling) return;
            const currentY = e.touches[0].clientY;
            const diff = currentY - pullStartY;

            if (diff > 0 && diff < 100) {
                const refreshEl = document.getElementById('pullToRefresh');
                refreshEl.classList.add('active');
                refreshEl.style.transform = `translateY(${diff}px)`;
            }
        }, { passive: true });

        document.addEventListener('touchend', () => {
            if (!pulling) return;
            pulling = false;
            const refreshEl = document.getElementById('pullToRefresh');

            if (parseInt(refreshEl.style.transform.replace('px', '')) > 50) {
                refreshEl.style.transform = 'translateY(60px)';
                setTimeout(() => {
                    // Simulate refresh
                    setTimeout(() => {
                        refreshEl.classList.remove('active');
                        refreshEl.style.transform = 'translateY(0)';
                    }, 1500);
                }, 500);
            } else {
                refreshEl.classList.remove('active');
                refreshEl.style.transform = 'translateY(0)';
            }
        });

        // Initialize
        renderBookmarks();
        renderRecents();
        renderDownloads();
    </script>
</body>
</html>
