<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>QLearner — Black & Gold</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0A0A0A;
      --charcoal: #1A1A1A;
      --gold: #D4AF37;
      --gold-dim: #C5A028;
      --gold-light: #E8C866;
      --text: #F5F5F5;
      --text-muted: #AAAAAA;
      --divider: rgba(212, 175, 55, 0.18);
      --shadow: rgba(0, 0, 0, 0.5);
      --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --ripple: rgba(212, 175, 55, 0.25);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      background: var(--black);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .arabic { font-family: 'Noto Sans Arabic', sans-serif; }

    /* Typography */
    h1, h2, h3, h4, p, span, div { margin: 0; }
    .title-xl { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
    .title-lg { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
    .title-md { font-size: 18px; font-weight: 600; letter-spacing: -0.2px; }
    .title-sm { font-size: 15px; font-weight: 500; }
    .body { font-size: 15px; font-weight: 400; line-height: 1.6; }
    .caption { font-size: 13px; font-weight: 400; color: var(--text-muted); }
    .gold { color: var(--gold); }

    /* Layout */
    #app {
      display: grid;
      grid-template-rows: 1fr min-content;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    /* Views */
    .view {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 24px 20px 100px;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 0.35s var(--ease), transform 0.35s var(--ease);
    }
    .view.active { opacity: 1; transform: none; pointer-events: auto; }
    .view-enter { transform: translateY(16px); }
    .view-exit { transform: translateY(-16px); }

    /* Ripple */
    .ripple {
      position: relative;
      overflow: hidden;
    }
    .ripple::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, var(--ripple) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .ripple:active::after { opacity: 1; }

    /* Surah Card */
    .surah-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid var(--divider);
    }
    .surah-number {
      width: 40px; height: 40px;
      display: grid; place-items: center;
      background: var(--charcoal);
      border: 1px solid var(--divider);
      border-radius: 12px;
      font-weight: 600;
      color: var(--gold);
    }
    .surah-info { flex: 1; }
    .surah-name { font-weight: 600; font-size: 16px; }
    .surah-meta { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .surah-play {
      width: 40px; height: 40px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dim) 100%);
      border-radius: 50%;
      box-shadow: 0 4px 14px rgba(212, 175, 55, 0.35);
      color: var(--black);
    }
    .surah-play svg { width: 18px; height: 18px; fill: currentColor; }

    /* Verse Row */
    .verse-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--divider);
      transition: background 0.2s;
    }
    .verse-row:active { background: rgba(212, 175, 55, 0.05); }
    .verse-number {
      min-width: 32px; height: 32px;
      display: grid; place-items: center;
      background: var(--charcoal);
      border: 1px solid var(--divider);
      border-radius: 10px;
      font-size: 13px;
      color: var(--gold);
      margin-top: 2px;
    }
    .verse-arabic {
      flex: 1;
      font-size: 22px;
      line-height: 1.7;
      color: var(--text);
    }
    .verse-actions {
      display: flex;
      gap: 8px;
      padding-top: 2px;
    }
    .icon-btn {
      width: 36px; height: 36px;
      display: grid; place-items: center;
      border-radius: 50%;
      color: var(--text-muted);
      transition: color 0.2s, background 0.2s;
    }
    .icon-btn:active { background: rgba(212, 175, 55, 0.1); }
    .icon-btn.active { color: var(--gold); }
    .icon-btn svg { width: 18px; height: 18px; fill: currentColor; }

    /* Player */
    #player-view {
      background: radial-gradient(1200px 600px at 50% -30%, rgba(212, 175, 55, 0.08), transparent 60%),
                  linear-gradient(180deg, var(--black) 0%, #111 100%);
      display: flex; flex-direction: column; align-items: center; padding: 48px 24px 120px;
      text-align: center;
    }
    .album-art {
      width: 260px; height: 260px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--charcoal), #222);
      border: 3px solid var(--gold);
      box-shadow: 0 0 0 6px rgba(212, 175, 55, 0.15), 0 20px 60px rgba(0,0,0,0.7);
      display: grid; place-items: center;
      margin-bottom: 32px;
    }
    .album-art svg { width: 80px; height: 80px; fill: var(--gold); opacity: 0.5; }
    .player-title { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
    .player-subtitle { color: var(--text-muted); font-size: 15px; }
    .progress-ring {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 320px; height: 320px;
      pointer-events: none;
    }
    .progress-ring circle {
      fill: none; stroke-width: 3;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
    .progress-ring .track { stroke: rgba(212, 175, 55, 0.12); }
    .progress-ring .bar { stroke: var(--gold); stroke-dasharray: 1000; stroke-dashoffset: 300; transition: stroke-dashoffset 0.2s linear; }
    .player-controls {
      display: flex; align-items: center; gap: 24px; margin-top: 24px;
    }
    .control-btn {
      width: 56px; height: 56px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: var(--charcoal);
      border: 1px solid var(--divider);
      color: var(--text);
    }
    .control-btn.play {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dim) 100%);
      border: none;
      color: var(--black);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
    }
    .control-btn svg { width: 24px; height: 24px; fill: currentColor; }
    .control-btn.play svg { width: 30px; height: 30px; }

    /* Mini Player */
    #mini-player {
      position: fixed; bottom: 80px; left: 20px; right: 20px;
      background: rgba(26, 26, 26, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid var(--divider);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      transform: translateY(120%);
      transition: transform 0.4s var(--ease);
      z-index: 100;
    }
    #mini-player.visible { transform: translateY(0); }
    .mini-thumb {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-dim));
      display: grid; place-items: center;
      color: var(--black);
    }
    .mini-thumb svg { width: 20px; height: 20px; fill: currentColor; }
    .mini-info { flex: 1; min-width: 0; }
    .mini-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-time { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .mini-progress {
      position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
      background: var(--charcoal);
    }
    .mini-progress-bar { height: 100%; background: var(--gold); width: 30%; transition: width 0.2s linear; }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(10, 10, 10, 0.96);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--divider);
      height: 80px;
      display: flex; align-items: stretch; justify-content: space-around;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 200;
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-item.active { color: var(--gold); }
    .nav-icon { width: 26px; height: 26px; }
    .nav-icon svg { width: 100%; height: 100%; fill: currentColor; }

    /* Search */
    .search-bar {
      position: sticky; top: 0;
      background: var(--black);
      padding: 8px 0 20px;
      z-index: 10;
    }
    .search-input {
      width: 100%;
      background: var(--charcoal);
      border: 1px solid var(--divider);
      border-radius: 14px;
      padding: 14px 18px;
      color: var(--text);
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
    }
    .search-input::placeholder { color: var(--text-muted); }

    /* Settings toggles */
    .settings-section { margin-bottom: 28px; }
    .settings-title { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; font-weight: 600; }
    .setting-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 0; border-bottom: 1px solid var(--divider);
    }
    .setting-label { font-size: 15px; font-weight: 500; }
    .toggle {
      width: 48px; height: 28px;
      background: var(--charcoal);
      border: 1px solid var(--divider);
      border-radius: 14px;
      position: relative;
      transition: background 0.2s;
    }
    .toggle::after {
      content: '';
      position: absolute; top: 3px; left: 3px;
      width: 20px; height: 20px;
      background: #555;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    .toggle.on { background: rgba(212, 175, 55, 0.25); border-color: var(--gold); }
    .toggle.on::after { transform: translateX(20px); background: var(--gold); }

    /* Divider */
    .divider { height: 1px; background: var(--divider); margin: 20px 0; }

    /* Smooth transitions library view */
    .list-group { margin-bottom: 24px; }
    .list-group-title { font-size: 18px; font-weight: 600; margin-bottom: 12px; color: var(--gold); }
    .list-item {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--divider);
      transition: background 0.2s;
    }
    .list-item:active { background: rgba(212, 175, 55, 0.05); }
    .list-thumb { width: 48px; height: 48px; border-radius: 12px; background: var(--charcoal); display: grid; place-items: center; color: var(--gold); }
    .list-thumb svg { width: 22px; height: 22px; fill: currentColor; }
    .list-info { flex: 1; }
    .list-title { font-weight: 600; font-size: 15px; }
    .list-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

    /* Safe area */
    .safe-top { padding-top: max(12px, env(safe-area-inset-top)); }
    .safe-bottom { padding-bottom: max(20px, env(safe-area-inset-bottom)); }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .fade-in { animation: fadeIn 0.35s var(--ease) both; }
  </style>
</head>
<body>
<div id="app">
  <!-- Views -->
  <div id="home-view" class="view active fade-in">
    <div class="search-bar safe-top">
      <input type="text" class="search-input" placeholder="Search surah..." id="search-input" aria-label="Search surah" />
    </div>
    <div id="surah-list" class="safe-bottom"></div>
  </div>

  <div id="surah-view" class="view">
    <div class="safe-top">
      <button class="icon-btn" id="surah-back" aria-label="Back" style="margin-bottom: 8px;">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <h2 class="title-lg gold" id="surah-title"></h2>
      <p class="caption" id="surah-meta" style="margin-top: 2px;"></p>
    </div>
    <div id="verse-list" class="safe-bottom"></div>
  </div>

  <div id="player-view" class="view">
    <div class="safe-top">
      <button class="icon-btn" id="player-close" aria-label="Close" style="position: absolute; left: 14px; top: 14px;">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
      <p class="caption" style="margin-top: 14px;">Now Playing</p>
    </div>
    <div class="album-art">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    </div>
    <h2 class="player-title" id="player-title"></h2>
    <p class="player-subtitle" id="player-subtitle"></p>
    <div class="progress-ring">
      <svg width="320" height="320" viewBox="0 0 320 320">
        <circle class="track" cx="160" cy="160" r="157"/>
        <circle class="bar" cx="160" cy="160" r="157"/>
      </svg>
    </div>
    <div class="player-controls">
      <button class="control-btn" id="prev-btn" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="control-btn play" id="play-btn" aria-label="Play">
        <svg viewBox="0 0 24 24" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="control-btn" id="next-btn" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
  </div>

  <div id="library-view" class="view">
    <div class="safe-top">
      <h2 class="title-lg gold">Library</h2>
    </div>
    <div class="safe-bottom">
      <div class="list-group">
        <div class="list-group-title">Bookmarks</div>
        <div id="bookmarks-list"></div>
      </div>
      <div class="list-group">
        <div class="list-group-title">Recently Played</div>
        <div id="recents-list"></div>
      </div>
    </div>
  </div>

  <div id="settings-view" class="view">
    <div class="safe-top">
      <h2 class="title-lg gold">Settings</h2>
    </div>
    <div class="safe-bottom">
      <div class="settings-section">
        <div class="settings-title">Appearance</div>
        <div class="setting-row">
          <span class="setting-label">Dark theme</span>
          <div class="toggle on" id="dark-theme-toggle" role="switch" aria-checked="true"></div>
        </div>
        <div class="setting-row">
          <span class="setting-label">Gold accents</span>
          <div class="toggle on" id="gold-toggle" role="switch" aria-checked="true"></div>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-title">Playback</div>
        <div class="setting-row">
          <span class="setting-label">Auto-play next</span>
          <div class="toggle on" id="autoplay-toggle" role="switch" aria-checked="true"></div>
        </div>
        <div class="setting-row">
          <span class="setting-label">Show translations</span>
          <div class="toggle" id="translation-toggle" role="switch" aria-checked="false"></div>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-title">Data</div>
        <div class="setting-row">
          <span class="setting-label">Download for offline</span>
          <div class="toggle" id="offline-toggle" role="switch" aria-checked="false"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mini Player -->
  <div id="mini-player" class="ripple" role="button" tabindex="0" aria-label="Open player">
    <div class="mini-thumb">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    </div>
    <div class="mini-info">
      <div class="mini-title" id="mini-title"></div>
      <div class="mini-time"><span id="mini-current">0:00</span> / <span id="mini-total">0:00</span></div>
    </div>
    <div class="mini-progress">
      <div class="mini-progress-bar" id="mini-bar"></div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <a class="nav-item active" data-route="home" href="#home" role="tab" aria-selected="true">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div>
      <span>Home</span>
    </a>
    <a class="nav-item" data-route="library" href="#library" role="tab" aria-selected="false">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg></div>
      <span>Library</span>
    </a>
    <a class="nav-item" data-route="settings" href="#settings" role="tab" aria-selected="false">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.07.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></div>
      <span>Settings</span>
    </a>
  </nav>
</div>

<script>
  // --- Data: Mock surahs (114) ---
  const surahs = Array.from({ length: 114 }, (_, i) => ({
    id: i + 1,
    name: `Surah ${i + 1}`,
    english: ['Al-Fatihah','Al-Baqarah','Aal-E-Imran','An-Nisa','Al-Ma\'idah','Al-An\'am','Al-A\'raf','Al-Anfal','At-Tawbah','Yunus','Hud','Yusuf','Ar-Rad','Ibrahim','Al-Hijr','An-Nahl','Al-Isra','Al-Kahf','Maryam','Taha','Al-Anbiya','Al-Hajj','Al-Mu\'minun','An-Nur','Al-Furqan','Ash-Shu\'ara','An-Naml','Al-Qasas','Al-Ankabut','Ar-Rum','Luqman','As-Sajdah','Al-Ahzab','Saba','Fatir','Ya-Sin','As-Saffat','Sad','Az-Zumar','Ghafir','Fussilat','Ash-Shura','Az-Zukhruf','Ad-Dukhan','Al-Jathiyah','Al-Ahqaf','Qaf','Adh-Dhariyat','At-Tur','An-Najm','Al-Qamar','Ar-Rahman','Al-Waqi\'ah','Al-Hadid','Al-Mujadila','Al-Hashr','Al-Mumtahanah','As-Saff','Al-Jumu\'ah','Al-Munafiqun','At-Taghabun','At-Talaq','At-Tahrim','Al-Mulk','Al-Qalam','Al-Haqqah','Al-Ma\'arij','Nuh','Al-Jinn','Al-Muzzammil','Al-Muddathir','Al-Qiyamah','Al-Insan','Al-Mursalat','An-Naba','An-Nazi\'at','Abasa','At-Takwir','Al-Infitar','Al-Mutaffifin','Al-Inshiqaq','Al-Buruj','At-Tariq','Al-A\'la','Al-Ghashiyah','Al-Fajr','Al-Balad','Ash-Shams','Al-Layl','Ad-Duha','Al-Inshirah','At-Tin','Al-Alaq','Al-Qadr','Al-Bayyinah','Az-Zalzalah','Al-Adiyat','Al-Qari\'ah','At-Takathur','Al-Asr','Al-Humazah','Al-Fil','Quraysh','Al-Ma\'un','Al-Kawthar','Al-Kafirun','An-Nasr','Al-Masad','Al-Ikhlas','Al-Falaq','An-Nas'][i] || `Surah ${i+1}`,
    verses: Math.floor(Math.random() * 200) + 3,
    type: ['Meccan','Medinan'][Math.floor(Math.random()*2)]
  }));

  // --- State ---
  const state = {
    route: 'home',
    surahId: null,
    player: {
      playing: false,
      current: 0,
      progress: 0,
      duration: 0,
      surah: null,
      surahs: []
    },
    library: {
      bookmarks: JSON.parse(localStorage.getItem('ql_bookmarks')||'[]'),
      recents: JSON.parse(localStorage.getItem('ql_recents')||'[]')
    },
    settings: {
      dark: true,
      gold: true,
      autoplay: true,
      translation: false,
      offline: false
    }
  };

  // --- Helpers ---
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);
  const fmt = (s) => {
    const m = Math.floor(s/60), sec = Math.floor(s%60);
    return `${m}:${sec.toString().padStart(2,'0')}`;
  };

  // --- Storage ---
  function saveLib() {
    localStorage.setItem('ql_bookmarks', JSON.stringify(state.library.bookmarks));
    localStorage.setItem('ql_recents', JSON.stringify(state.library.recents));
  }

  // --- Routing ---
  function navigate(route, surahId = null) {
    const views = $$('.view');
    views.forEach(v => v.classList.remove('active'));
    const target = $(`#${route.replace(':id','surah')}-view`);
    if (target) target.classList.add('active');

    state.route = route;
    state.surahId = surahId;

    // Nav state
    $$('.nav-item').forEach(el => {
      const isActive = el.dataset.route === route.split('/')[0];
      el.classList.toggle('active', isActive);
      el.setAttribute('aria-selected', isActive);
    });

    // Mini player hide on certain views
    const mini = $('#mini-player');
    if (route === 'player') mini.classList.remove('visible');
    else if (state.player.surah) mini.classList.add('visible');

    if (route === 'home') renderHome();
    if (route === 'surah' && surahId) renderSurah(surahId);
    if (route === 'library') renderLibrary();
    if (route === 'settings') renderSettings();
  }

  // --- Render Home ---
  function renderHome() {
    const list = $('#surah-list');
    list.innerHTML = '';
    const q = $('#search-input').value.toLowerCase();
    const filtered = surahs.filter(s => s.name.toLowerCase().includes(q) || s.english.toLowerCase().includes(q));

    filtered.forEach(s => {
      const el = document.createElement('div');
      el.className = 'surah-card ripple';
      el.innerHTML = `
        <div class="surah-number">${s.id}</div>
        <div class="surah-info">
          <div class="surah-name">${s.english}</div>
          <div class="surah-meta arabic">${s.name} • ${s.verses} verses • ${s.type}</div>
        </div>
        <div class="surah-play" data-id="${s.id}" role="button" aria-label="Play ${s.english}">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
      `;
      el.querySelector('.surah-play').addEventListener('click', () => playSurah(s.id));
      el.addEventListener('click', (e) => {
        if (!e.target.closest('.surah-play')) navigate('surah', s.id);
      });
      list.appendChild(el);
    });
  }

  // --- Render Surah Detail ---
  function renderSurah(id) {
    const s = surahs.find(x => x.id === id);
    if (!s) return;
    $('#surah-title').textContent = s.english;
    $('#surah-meta').textContent = `${s.name} • ${s.verses} verses • ${s.type}`;

    const list = $('#verse-list');
    list.innerHTML = '';
    for (let v = 1; v <= Math.min(s.verses, 30); v++) {
      const row = document.createElement('div');
      row.className = 'verse-row ripple';
      row.innerHTML = `
        <div class="verse-number">${v}</div>
        <div class="verse-arabic arabic">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
        <div class="verse-actions">
          <button class="icon-btn bookmark" data-verse="${v}" aria-label="Bookmark verse">
            <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
          </button>
        </div>
      `;
      row.querySelector('.bookmark').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleBookmark(s.id, v);
      });
      list.appendChild(row);
    }
  }

  // --- Render Library ---
  function renderLibrary() {
    const bkmk = $('#bookmarks-list');
    const recent = $('#recents-list');
    bkmk.innerHTML = ''; recent.innerHTML = '';

    state.library.bookmarks.forEach(item => {
      const s = surahs.find(x => x.id === item.surahId);
      if (!s) return;
      const el = document.createElement('div');
      el.className = 'list-item ripple';
      el.innerHTML = `
        <div class="list-thumb"><svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg></div>
        <div class="list-info">
          <div class="list-title">${s.english} • Verse ${item.verse}</div>
          <div class="list-subtitle">Bookmark</div>
        </div>
      `;
      el.addEventListener('click', () => navigate('surah', s.id));
      bkmk.appendChild(el);
    });

    state.library.recents.slice().reverse().forEach(surah => {
      const el = document.createElement('div');
      el.className = 'list-item ripple';
      el.innerHTML = `
        <div class="list-thumb"><svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></div>
        <div class="list-info">
          <div class="list-title">${surah.english}</div>
          <div class="list-subtitle">${surah.name} • ${surah.verses} verses</div>
        </div>
      `;
      el.addEventListener('click', () => navigate('surah', surah.id));
      recent.appendChild(el);
    });
  }

  // --- Render Settings ---
  function renderSettings() {
    $('#dark-theme-toggle').classList.toggle('on', state.settings.dark);
    $('#gold-toggle').classList.toggle('on', state.settings.gold);
    $('#autoplay-toggle').classList.toggle('on', state.settings.autoplay);
    $('#translation-toggle').classList.toggle('on', state.settings.translation);
    $('#offline-toggle').classList.toggle('on', state.settings.offline);
  }

  // --- Player Logic ---
  function playSurah(id) {
    const s = surahs.find(x => x.id === id);
    state.player.surah = s;
    state.player.surahs = surahs;
    state.player.current = 0;
    state.player.progress = 0;
    state.player.duration = s.verses * 22; // mock: 22s/verse
    state.player.playing = true;

    // Add to recents (keep last 10)
    state.library.recents = state.library.recents.filter(x => x.id !== id).slice(-9).concat(s);
    saveLib();

    updatePlayerUI();
    navigate('player');
    requestAnimationFrame(tick);
  }

  function togglePlay() {
    state.player.playing = !state.player.playing;
    updatePlayButton();
    if (state.player.playing) requestAnimationFrame(tick);
  }

  function tick() {
    if (!state.player.playing) return;
    state.player.progress += 0.05; // seconds per frame ~16ms
    if (state.player.progress >= state.player.duration) {
      state.player.progress = 0;
      if (state.settings.autoplay && state.player.current < state.player.surahs.length - 1) {
        state.player.current++;
        playSurah(state.player.surahs[state.player.current].id);
        return;
      } else {
        state.player.playing = false;
        updatePlayButton();
        return;
      }
    }
    updatePlayerUI();
    requestAnimationFrame(tick);
  }

  function updatePlayerUI() {
    const p = state.player;
    const s = p.surah;
    if (!s) return;

    $('#player-title').textContent = s.english;
    $('#player-subtitle').textContent = `${s.name} • Verse 1 of ${s.verses}`;

    const pct = (p.progress / p.duration) * 100;
    const ring = $('#player-view .progress-ring .bar');
    const circumference = 2 * Math.PI * 157;
    ring.style.strokeDashoffset = circumference * (1 - pct/100);

    $('#mini-current').textContent = fmt(p.progress);
    $('#mini-total').textContent = fmt(p.duration);
    $('#mini-bar').style.width = `${pct}%`;
    $('#mini-title').textContent = s.english;
  }

  function updatePlayButton() {
    const path = state.player.playing
      ? 'M6 19h4V5H6v14zm8-14v14h4V5h-4z'
      : 'M8 5v14l11-7z';
    $('#play-icon').setAttribute('d', path);
  }

  function toggleBookmark(surahId, verse) {
    const list = state.library.bookmarks;
    const idx = list.findIndex(x => x.surahId === surahId && x.verse === verse);
    if (idx >= 0) list.splice(idx, 1);
    else list.push({ surahId, verse });
    saveLib();
    renderSurah(surahId);
  }

  // --- Events ---
  window.addEventListener('hashchange', () => {
    const hash = location.hash.slice(1) || 'home';
    const [route, param] = hash.split('/');
    navigate(route, param ? parseInt(param) : null);
  });

  $('#search-input').addEventListener('input', () => renderHome());

  $('#surah-back').addEventListener('click', () => navigate('home'));
  $('#player-close').addEventListener('click', () => navigate('home'));
  $('#mini-player').addEventListener('click', () => navigate('player'));

  $('#play-btn').addEventListener('click', togglePlay);
  $('#prev-btn').addEventListener('click', () => {
    const idx = state.player.surahs.findIndex(x => x.id === state.player.surah.id);
    if (idx > 0) playSurah(state.player.surahs[idx-1].id);
  });
  $('#next-btn').addEventListener('click', () => {
    const idx = state.player.surahs.findIndex(x => x.id === state.player.surah.id);
    if (idx < state.player.surahs.length-1) playSurah(state.player.surahs[idx+1].id);
  });

  // Settings toggles
  $('#dark-theme-toggle').addEventListener('click', () => {
    state.settings.dark = !state.settings.dark;
    $('#dark-theme-toggle').classList.toggle('on', state.settings.dark);
  });
  $('#gold-toggle').addEventListener('click', () => {
    state.settings.gold = !state.settings.gold;
    $('#gold-toggle').classList.toggle('on', state.settings.gold);
  });
  $('#autoplay-toggle').addEventListener('click', () => {
    state.settings.autoplay = !state.settings.autoplay;
    $('#autoplay-toggle').classList.toggle('on', state.settings.autoplay);
  });
  $('#translation-toggle').addEventListener('click', () => {
    state.settings.translation = !state.settings.translation;
    $('#translation-toggle').classList.toggle('on', state.settings.translation);
  });
  $('#offline-toggle').addEventListener('click', () => {
    state.settings.offline = !state.settings.offline;
    $('#offline-toggle').classList.toggle('on', state.settings.offline);
  });

  // Ripple effect
  document.addEventListener('click', (e) => {
    const el = e.target.closest('.ripple');
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.style.cssText = `
      position: absolute; left: ${e.clientX - rect.left}px; top: ${e.clientY - rect.top}px;
      width: 0; height: 0; border-radius: 50%; background: radial-gradient(circle, var(--ripple) 0%, transparent 70%);
      transform: translate(-50%, -50%); pointer-events: none; animation: ripple 0.35s ease-out forwards;
    `;
    el.style.position = 'relative';
    el.appendChild(ripple);
    setTimeout(() => ripple.remove(), 350);
  });

  // Add ripple keyframes
  const style = document.createElement('style');
  style.textContent = `
    @keyframes ripple {
      to { width: 200px; height: 200px; opacity: 0; }
    }
  `;
  document.head.appendChild(style);

  // --- Init ---
  function init() {
    // Preload saved player? skip for mock
    navigate('home');
  }

  // Start
  init();
</script>
</body>
</html>
